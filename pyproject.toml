[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-py"
version = "0.3.3"
description = "Unofficial async Python API + CLI for Google NotebookLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Teng Lin" }
]
keywords = ["notebooklm", "google", "api", "cli", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.28,<1",
  "rich>=13,<14",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.49,<2",
]
mcp = [
  "mcp>=1.0,<2",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/teng-lin/notebooklm-py"
Repository = "https://github.com/teng-lin/notebooklm-py"
Issues = "https://github.com/teng-lin/notebooklm-py/issues"

[project.scripts]
notebooklm = "notebooklm.notebooklm_cli:main"
notebooklm-mcp = "notebooklm_mcp:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["notebooklm*", "notebooklm_mcp*"]

[tool.setuptools.package-data]
"notebooklm.data" = ["SKILL.md"]
