[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-py"
version = "0.3.3"
description = "Unofficial async Python SDK + CLI for Google NotebookLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Teng Lin" }
]
keywords = ["notebooklm", "google", "sdk", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.28,<1",
  "rich>=13,<14",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.49,<2",
]
dev = [
  "mypy>=1.20.1,<2",
  "playwright>=1.49,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-httpx>=0.36.2,<1",
  "pytest-rerunfailures>=16.1,<17",
  "python-dotenv>=1,<2",
  "ruff>=0.15.10,<1",
  "vcrpy>=8.1.1,<9",
]
all = [
  "mypy>=1.20.1,<2",
  "playwright>=1.49,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-httpx>=0.36.2,<1",
  "pytest-rerunfailures>=16.1,<17",
  "python-dotenv>=1,<2",
  "ruff>=0.15.10,<1",
  "vcrpy>=8.1.1,<9",
]

[project.scripts]
notebooklm = "notebooklm.notebooklm_cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["notebooklm", "notebooklm.*"]

[tool.pytest.ini_options]
markers = [
  "e2e: marks tests that call the live NotebookLM service",
  "flaky: marks tests that may need reruns due to external instability",
  "readonly: marks tests that only read existing NotebookLM resources",
  "variants: marks parameterized variant coverage tests",
  "vcr: marks tests that use VCR cassettes",
]
filterwarnings = [
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3.16; use inspect\\.iscoroutinefunction\\(\\) instead:DeprecationWarning:vcr\\.cassette",
]
